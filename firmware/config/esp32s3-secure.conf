# Secure build for the ESP32-S3 — layered on top of esp32s3.conf when the
# project is configured with -D QUICK_WALLET_SECURE=1 (see ../CMakeLists.txt):
#
#   idf.py -B build.esp32s3-secure -D QUICK_WALLET_SECURE=1 build
#
# EVERYTHING HERE IS IRREVERSIBLE ON THE BOARD. None of it does anything at
# build time; the bootloader burns the eFuses itself on the first boot of an
# image built with it. So this build is never flashed from the terminal:
# it reaches a board only through the web installer, from a published
# release.
#
# The bootloader starts flash encryption in Development mode; the app then
# switches it to Release mode and Secure Download mode on its first accepted
# start (main.c, on_sync()), which closes USB flashing and reading for good.
# The bootloader itself is never replaced by OTA, so what it does stays as
# the board's first secure image set it up.
#
# What the first boot of this build burns (IDF 5.3,
# components/bootloader_support/src/esp32s3/*_secure_features.c):
#   - SECURE_BOOT_EN and the digest of the Secure Boot public key; unused
#     digest slots are revoked;
#   - a generated flash-encryption key (read-protected) and SPI_BOOT_CRYPT_CNT;
#   - JTAG off for good (HARD_DIS_JTAG, SOFT_DIS_JTAG, DIS_USB_JTAG) — only
#     JTAG: the USB serial port and ROM download mode keep working;
#   - DIS_DOWNLOAD_ICACHE/DCACHE, DIS_DIRECT_BOOT, WR_DIS_RD_DIS.

# Secure Boot V2 (RSA-3072 on this chip). Images are built unsigned and
# signed offline at release time, so the private key never has to sit in the
# project directory.
CONFIG_SECURE_BOOT=y
CONFIG_SECURE_BOOT_V2_ENABLED=y
# CONFIG_SECURE_BOOT_BUILD_SIGNED_BINARIES is not set

# Flash encryption: Development mode in the bootloader; the app moves it to
# Release mode (see above).
CONFIG_SECURE_FLASH_ENC_ENABLED=y
CONFIG_SECURE_FLASH_ENCRYPTION_MODE_DEVELOPMENT=y
# Stated rather than left to the default: full ROM download mode stays on
# until the app's switch to Release mode also turns on Secure Download mode.
CONFIG_SECURE_INSECURE_ALLOW_DL_MODE=y

# The PIN seal key (wallet_key.c) is an HMAC key burned read-protected into
# an eFuse block by the app. By default the bootloader closes the RD_DIS
# field (WR_DIS_RD_DIS) on its first boot, before the app ever runs, and no
# key could be read-protected after that. So the bootloader leaves it open
# and the app closes it itself, right after burning its key, on that same
# first start. The end state in eFuse is the one the default gives, plus the
# key. SECURE_BOOT_INSECURE only makes the option visible; everything else
# in that menu keeps its secure default.
CONFIG_SECURE_BOOT_INSECURE=y
CONFIG_SECURE_BOOT_V2_ALLOW_EFUSE_RD_DIS=y

# Anti-rollback. An option of the bootloader, which OTA never replaces: it
# has to be in the very first secure image or it can never be added. The
# secure version lives in the app header; bump it only for a release that
# fixes a security bug, since each bump burns one of the 16 eFuse bits for
# good and old versions can never boot again.
CONFIG_BOOTLOADER_APP_ANTI_ROLLBACK=y
CONFIG_BOOTLOADER_APP_SECURE_VERSION=0
CONFIG_BOOTLOADER_APP_SEC_VER_SIZE_EFUSE_FIELD=16
