# Configuration for the ESP32-S3 (LilyGO T-Display-S3) — selected by target
# in ../CMakeLists.txt, which explains why this is a per-chip file rather
# than an sdkconfig.defaults. Nothing here is meant to carry over to another
# chip: flash size, partition-table offset and the eFuse-backed security
# options below are all properties of this chip and this board. A second
# chip gets its own config/<target>.conf, decided on its own terms.

# Bluetooth: NimBLE stack only (smaller footprint than Bluedroid, BLE-only which is all we need)
CONFIG_BT_ENABLED=y
CONFIG_BT_NIMBLE_ENABLED=y
CONFIG_BT_CONTROLLER_ONLY=n
CONFIG_BT_BLUEDROID_ENABLED=n

CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
# Peripheral only: the device advertises and accepts one connection; it
# never scans or connects out. Advertising and connection handling stay
# compiled in, since NimBLE builds both for the peripheral role as well.
CONFIG_BT_NIMBLE_ROLE_CENTRAL=n
CONFIG_BT_NIMBLE_ROLE_OBSERVER=n
CONFIG_BT_NIMBLE_ROLE_BROADCASTER=n

# LE Secure Connections pairing, with the passkey shown on the LCD
# (see main.c: BLE_HS_IO_DISPLAY_ONLY).
CONFIG_BT_NIMBLE_SM_SC=y

# Persist bonding keys in NVS so the phone stays bonded across device
# reboots instead of re-pairing every time.
CONFIG_BT_NIMBLE_NVS_PERSIST=y

CONFIG_PARTITION_TABLE_CUSTOM=y
CONFIG_PARTITION_TABLE_CUSTOM_FILENAME="partitions.csv"
# The board's module (ESP32-S3R8) carries 16MB of flash. The partition
# table only uses the first ~3.3MB of it; the rest is left unmapped rather
# than handed to a partition nothing reads, but the size is declared
# honestly so the image header matches the chip.
CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
CONFIG_ESPTOOLPY_FLASHSIZE="16MB"

# This board has no USB-serial bridge chip: the USB-C port is wired
# straight to the ESP32-S3's own USB peripheral, which is also how it is
# flashed. The console has to follow it there, or `idf.py monitor` shows
# nothing (the default UART0 console would go to GPIO43/44, which are only
# exposed as header pins here).
CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG=y

# The module also has 8MB of PSRAM, deliberately left disabled: nothing in
# this firmware needs it (the largest buffer is the display's 10KB band),
# and keys and PIN material should not be able to drift out of the chip's
# internal RAM into a separate package.
# Secure Boot v2 + Flash Encryption grow the bootloader past the default
# 0x7000-byte budget (offset 0x8000 - 0x1000); moved out to 0xe000 to give
# it 0xd000 bytes of room. partitions.csv offsets are shifted to match, so
# this stays where it is whether or not those two are on yet.
CONFIG_PARTITION_TABLE_OFFSET=0xe000

# Optimize for speed and run at full clock: wallet creation (PBKDF2-HMAC-
# SHA512 with grinding), PIN checks (PBKDF2 inside the NimBLE task, which
# stalls BLE while it runs) and software ed25519 are all CPU-bound. IDF's
# defaults are -Og and 160 MHz; the board is USB-powered, so 240 MHz costs
# nothing that matters.
CONFIG_COMPILER_OPTIMIZATION_PERF=y
CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ_240=y

# Logs: warnings and errors only, for the app and for NimBLE alike. The
# USB console stays readable on the burned board, so it should say as
# little as possible, and the dropped strings shrink the image, which every
# OTA update has to carry over BLE.
CONFIG_LOG_DEFAULT_LEVEL_WARN=y
CONFIG_BT_NIMBLE_LOG_LEVEL_ERROR=y

# Smaller image, same behaviour: a failed assert() or ESP_ERROR_CHECK still
# aborts and reboots, only without printing file, line and expression.
CONFIG_COMPILER_OPTIMIZATION_ASSERTIONS_SILENT=y

# Secure Boot V2 and Flash Encryption live in esp32s3-secure.conf, the build
# that runs on the board. This file alone builds an unsecured image for a
# spare, unburned board.

# CONFIG_NVS_ENCRYPTION pulls in the newer nvs_sec_provider component.
# wallet_key.c doesn't need it: it manages NVS encryption itself via the
# older nvs_key-partition scheme (nvs_flash_secure_init()).
# CONFIG_NVS_ENCRYPTION is not set

# OTA over BLE (see ota_service.c): a new image boots into a "pending
# verify" state; if it doesn't reach app_main's
# esp_ota_mark_app_valid_cancel_rollback() call (crash, hang, power loss),
# the bootloader automatically reverts to the previous working slot.
CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=y
